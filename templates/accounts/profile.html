{% extends 'base.html' %}
{% load static %}

{% block title %}
پروفایل
{% endblock %}

{% block content %}

{% include "components/navbar.html" %}

<main class="max-w-3xl mx-auto px-4 py-10">

    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">

        <div class="bg-gradient-to-r from-primary-600 to-primary-700 h-32"></div>

        <div class="px-8 pb-8">

            <div class="flex flex-col items-center -mt-16">

                <img
                    id="avatar-preview"
                    src="{% static 'images/default-avatar.png' %}"
                    class="w-32 h-32 rounded-full border-4 border-white shadow-lg object-cover">

                <input
                    id="avatar"
                    type="file"
                    accept="image/*"
                    class="mt-5 text-sm">

                <h2 class="text-2xl font-black mt-4">
                    پروفایل من
                </h2>

                <p class="text-slate-500">
                    اطلاعات حساب کاربری
                </p>

            </div>


            <div class="mt-8 space-y-5">

                <div>

                    <label class="block mb-2 font-bold">
                        ایمیل
                    </label>

                    <input
                        id="email"
                        readonly
                        class="w-full rounded-xl border bg-slate-100 p-3">

                </div>


                <div>

                    <label class="block mb-2 font-bold">
                        نام
                    </label>

                    <input
                        id="first_name"
                        class="w-full rounded-xl border p-3">

                </div>


                <div>

                    <label class="block mb-2 font-bold">
                        نام خانوادگی
                    </label>

                    <input
                        id="last_name"
                        class="w-full rounded-xl border p-3">

                </div>


                <div>

                    <label class="block mb-2 font-bold">
                        درباره من
                    </label>

                    <textarea
                        id="bio"
                        rows="5"
                        class="w-full rounded-xl border p-3 resize-none"></textarea>

                </div>


                <button
                    id="save-profile"
                    class="w-full bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-xl font-bold transition">

                    ذخیره تغییرات

                </button>

            </div>

        </div>

    </div>

</main>

{% endblock %}

{% block extra_js %}

<script src="{% static 'js/profile.js' %}"></script>

{% endblock %}
