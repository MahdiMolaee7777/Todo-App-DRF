{% extends "base.html" %}
{% load static %}

{% block title %}
بازیابی رمز عبور
{% endblock %}

{% block content %}

<main class="min-h-[calc(100vh-64px)] flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">

            <div class="text-center mb-8">

                <div class="mx-auto w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center">

                    <svg class="w-8 h-8 text-primary-600"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M12 11c0-3.314 2.686-6 6-6m0 0v4m0-4h-4M5 19h14a2 2 0 002-2v-2a7 7 0 00-14 0v2a2 2 0 002 2z"/>

                    </svg>

                </div>

                <h1 class="text-2xl font-black text-slate-900 mt-5">

                    بازیابی رمز عبور

                </h1>

                <p class="text-sm text-slate-500 mt-2 leading-6">

                    ایمیل حساب کاربری خود را وارد کنید.<br>

                    لینک تغییر رمز برای شما ارسال خواهد شد.

                </p>

            </div>

            <form id="forgot-password-form"
                  autocomplete="off"
                  class="space-y-5">

                <div>

                    <label class="block mb-2 font-bold text-slate-700">

                        آدرس ایمیل

                    </label>

                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="example@gmail.com"
                        class="w-full px-4 py-3 rounded-xl
                               border border-slate-200
                               bg-slate-50
                               focus:outline-none
                               focus:ring-4
                               focus:ring-primary-500/20
                               focus:border-primary-500
                               transition">

                </div>

                <p id="error-box"
                   class="text-sm text-red-600"></p>

                <button
                    id="submit-btn"
                    type="submit"
                    class="w-full py-3 rounded-xl
                           bg-primary-600
                           hover:bg-primary-700
                           text-white
                           font-black
                           shadow-lg
                           transition">

                    ارسال لینک بازیابی

                </button>

            </form>

            <div class="mt-8 border-t pt-6 text-center">

                <a href="/login/"
                   class="text-primary-600 hover:text-primary-700 font-bold">

                    بازگشت به صفحه ورود

                </a>

            </div>

        </div>

    </div>

</main>

{% endblock %}

{% block extra_js %}

<script src="{% static 'js/forgot_password.js' %}"></script>

{% endblock %}
