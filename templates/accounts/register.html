{% extends 'base.html' %}

{% load static %}

{% block title %}ثبت نام کاربر جدید{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8">


        <!-- Logo -->
        <div class="text-center">

            <div class="mx-auto h-16 w-16 bg-gradient-to-br from-emerald-500 to-teal-700 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/50">

                <svg class="h-10 w-10 text-white"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>

                </svg>

            </div>


            <h2 class="mt-6 text-4xl font-black text-slate-900">
                عضویت در سامانه ✨
            </h2>


            <p class="mt-3 text-sm text-slate-600 font-medium">
                حساب کاربری خود را در چند ثانیه بسازید
            </p>


        </div>



        <!-- Register Card -->

        <div class="mt-8 bg-white rounded-3xl shadow-2xl border border-slate-200/50 overflow-hidden">


            <div class="px-8 py-10">


                <div id="register-error"
                     class="hidden mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 font-bold text-sm">
                </div>


                <form id="register-form"
                      class="space-y-6">



                    <!-- Username -->

                    <div>

                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            نام کاربری
                        </label>


                        <input id="username"
                               name="username"
                               type="text"
                               required
                               placeholder="نام کاربری خود را وارد کنید"
                               class="block w-full px-4 py-3.5 text-slate-900 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">


                    </div>




                    <!-- Email -->

                    <div>

                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            ایمیل
                        </label>


                        <input id="email"
                               name="email"
                               type="email"
                               required
                               placeholder="example@gmail.com"
                               class="block w-full px-4 py-3.5 text-slate-900 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">


                    </div>





                    <!-- Password -->

                    <div>

                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            رمز عبور
                        </label>


                        <input id="password"
                               name="password"
                               type="password"
                               required
                               placeholder="رمز عبور"
                               class="block w-full px-4 py-3.5 text-slate-900 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">


                    </div>





                    <!-- Confirm Password -->

                    <div>

                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            تکرار رمز عبور
                        </label>


                        <input id="password-confirm"
                               name="password_confirm"
                               type="password"
                               required
                               placeholder="تکرار رمز عبور"
                               class="block w-full px-4 py-3.5 text-slate-900 bg-slate-50 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">


                    </div>





                    <!-- Button -->

                    <div class="pt-4">

                        <button type="submit"

                                class="w-full flex justify-center py-4 px-4 rounded-xl text-white font-black bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 shadow-lg transition">


                            ایجاد حساب کاربری


                        </button>


                    </div>



                </form>



            </div>





            <!-- Login Link -->

            <div class="px-8 py-6 bg-gradient-to-br from-slate-50 to-slate-100 border-t border-slate-200">


                <p class="text-center text-sm text-slate-600">


                    قبلاً ثبت‌نام کرده‌اید؟


                    <a href="/login/"
                       class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline">

                        وارد شوید

                    </a>


                </p>


            </div>



        </div>


    </div>


</div>



{% endblock %}




{% block extra_js %}

<script src="{% static 'js/register.js' %}"></script>

{% endblock %}
