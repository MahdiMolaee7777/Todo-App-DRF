{% extends "base.html" %}

{% load static %}


{% block title %}
تغییر رمز عبور
{% endblock %}



{% block content %}


{% include "components/navbar.html" %}



<main class="min-h-[calc(100vh-64px)] flex items-center justify-center px-4 py-10">


    <div class="w-full max-w-md">


        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">


            <div class="text-center mb-8">


                <div class="mx-auto w-16 h-16 rounded-full 
                            bg-primary-100 
                            flex items-center justify-center">


                    <svg class="w-8 h-8 text-primary-600"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2h-1V7a5 5 0 00-10 0v4H6a2 2 0 00-2 2v6a2 2 0 002 2z"/>

                    </svg>


                </div>



                <h1 class="text-2xl font-black mt-5 text-slate-900">

                    تغییر رمز عبور

                </h1>



                <p class="text-sm text-slate-500 mt-2">

                    رمز عبور حساب خود را تغییر دهید

                </p>


            </div>





            <form id="change-password-form"
                  autocomplete="off"
                  class="space-y-5">





                <div>


                    <label class="block mb-2 font-bold text-slate-700">

                        رمز فعلی

                    </label>


                    <input id="old_password"
                           name="current-password"
                           type="password"
                           autocomplete="current-password"
                           required
                           class="w-full px-4 py-3 rounded-xl 
                                  border border-slate-200
                                  bg-slate-50
                                  focus:ring-4
                                  focus:ring-primary-500/20
                                  focus:border-primary-500">


                </div>







                <div>


                    <label class="block mb-2 font-bold text-slate-700">

                        رمز جدید

                    </label>



                    <input id="new_password"
                           name="new-password"
                           type="password"
                           autocomplete="new-password"
                           required
                           class="w-full px-4 py-3 rounded-xl 
                                  border border-slate-200
                                  bg-slate-50
                                  focus:ring-4
                                  focus:ring-primary-500/20
                                  focus:border-primary-500">


                </div>







                <div>


                    <label class="block mb-2 font-bold text-slate-700">

                        تکرار رمز جدید

                    </label>



                    <input id="confirm_password"
                           name="confirm-password"
                           type="password"
                           autocomplete="new-password"
                           required
                           class="w-full px-4 py-3 rounded-xl 
                                  border border-slate-200
                                  bg-slate-50
                                  focus:ring-4
                                  focus:ring-primary-500/20
                                  focus:border-primary-500">


                </div>






                <p id="error-box"
                   class="text-red-600 text-sm">
                </p>







                <button type="submit"

                        class="w-full py-3 rounded-xl
                               bg-primary-600
                               hover:bg-primary-700
                               text-white
                               font-black
                               shadow-lg
                               transition">


                    تغییر رمز عبور


                </button>




            </form>


        </div>


    </div>


</main>



{% endblock %}





{% block extra_js %}

<script src="{% static 'js/api-client.js' %}"></script>
<script src="{% static 'js/change_password.js' %}"></script>

{% endblock %}
