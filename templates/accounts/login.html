{% extends 'base.html' %}

{% load static %}

{% block title %}ورود به حساب کاربری{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8">

        <!-- Logo -->
        <div class="text-center">
            <div class="mx-auto h-16 w-16 bg-gradient-to-br from-primary-500 to-primary-700 rounded-2xl flex items-center justify-center shadow-lg">
                <svg class="h-10 w-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                </svg>
            </div>

            <h2 class="mt-6 text-4xl font-black text-slate-900">
                خوش آمدید 👋
            </h2>

            <p class="mt-3 text-sm text-slate-600">
                وارد حساب کاربری خود شوید
            </p>
        </div>

        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">

            <div class="px-8 py-10">

                <!-- Error Message -->
                <div id="error-box"
                     class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-bold">
                </div>

                <form id="login-form" class="space-y-6">

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            ایمیل 
                        </label>

                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-primary-500 focus:outline-none"
                            placeholder="ایمیل">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            رمز عبور
                        </label>

                        <input
                            id="password"
                            type="password"
                            autocomplete="current-password"
                            class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-primary-500 focus:outline-none"
                            placeholder="رمز عبور">
                    </div>

                    <button
                        id="login-btn"
                        type="submit"
                        class="w-full py-4 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-black transition">

                        ورود

                    </button>

                    <div class="flex justify-between items-center mt-5">

                        <a href="{% url 'pages:forgot-password' %}"
                        class="text-sm font-bold text-primary-600 hover:text-primary-700">

                            رمز عبور را فراموش کرده‌اید؟

                        </a>

                    </div>

                </form>

            </div>

            <div class="px-8 py-6 bg-slate-50 border-t">

                <p class="text-center text-sm text-slate-600">

                    حساب ندارید؟

                    <a href="/register/"
                       class="font-bold text-primary-600 hover:underline">

                        ثبت نام

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>
{% endblock %}

{% block extra_js %}

<script src="{% static 'js/auth.js' %}"></script>

<script src="{% static 'js/login.js' %}"></script>

{% endblock %}
