{% extends 'base.html' %}

{% load static %}

{% block title %}ایجاد کار جدید{% endblock %}


{% block content %}

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-3xl w-full">


        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">


            <!-- Header -->
            <div class="bg-gradient-to-r from-primary-600 to-primary-700 px-8 py-6">

                <h4 class="text-2xl font-black text-white flex items-center gap-3">

                    ایجاد کار جدید

                </h4>

            </div>



            <div class="px-8 py-8">


                <div id="error-box"
                     class="hidden mb-5 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700">
                </div>



                <form id="todo-form" class="space-y-6">



                    <!-- Title -->
                    <div>

                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            عنوان
                        </label>


                        <input
                            id="title"
                            type="text"
                            required
                            class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-primary-500 focus:outline-none"
                            placeholder="عنوان کار">


                    </div>




                    <!-- Description -->
                    <div>

                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            توضیحات
                        </label>


                        <textarea
                            id="description"
                            rows="4"
                            class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-primary-500 focus:outline-none"
                            placeholder="توضیحات">
                        </textarea>


                    </div>





                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">



                        <!-- Priority -->

                        <div>

                            <label class="block text-sm font-bold text-slate-700 mb-2">
                                اولویت
                            </label>


                            <select
                                id="priority"
                                class="w-full px-4 py-3 rounded-xl border-2 border-slate-200">


                                <option value="low">
                                    کم
                                </option>


                                <option value="medium" selected>
                                    متوسط
                                </option>


                                <option value="high">
                                    زیاد
                                </option>


                            </select>


                        </div>





                        <!-- Category -->


                        <div>


                            <label class="block text-sm font-bold text-slate-700 mb-2">
                                دسته بندی
                            </label>


                            <select
                                id="category"
                                class="w-full px-4 py-3 rounded-xl border-2 border-slate-200">


                            </select>

                            <button
                                type="button"
                                id="create-category-btn"
                                class="text-primary-600 font-bold">

                                + دسته جدید

                            </button>


                        </div>


                    </div>






                    <!-- Due Date -->

                    <div>


                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            مهلت انجام
                        </label>


                        <input
                            id="due_date"
                            type="text"
                            data-jdp
                            autocomplete="off"
                            placeholder="۱۴۰۵/۰۵/۱۹"
                            class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-primary-500 focus:outline-none">


                    </div>







                    <!-- Buttons -->

                    <div class="flex justify-between pt-6 border-t">


                        <button
                            id="save-todo-btn"
                            type="submit"
                            class="px-8 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-black">

                            ذخیره

                        </button>




                        <a href="/todos/"
                           class="px-8 py-3 bg-slate-100 rounded-xl font-bold">

                            انصراف

                        </a>


                    </div>

                    <div id="category-modal"
                    class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">


                    <div class="bg-white rounded-2xl p-6 w-96">


                    <h3 class="font-bold text-xl mb-4">
                    ساخت دسته‌بندی
                    </h3>


                    <input
                    id="category-name"
                    class="border p-3 w-full rounded-xl mb-3"
                    placeholder="نام دسته">


                    <input
                    id="category-color"
                    type="color"
                    class="mb-4">


                    <button
                    id="save-category-btn"
                    type="button"
                    class="bg-primary-600 text-white px-5 py-2 rounded-xl">

                    افزودن

                    </button>


                    </div>


                    </div>




                </form>


            </div>


        </div>


    </div>


</div>



{% endblock %}





{% block extra_js %}

<script src="{% static 'js/todo.js' %}"></script>
<script src="{% static 'js/api-client.js' %}"></script>
<script src="{% static 'js/category.js' %}"></script>


{% comment %} <script src="{% static 'js/todo-create.js' %}"></script> {% endcomment %}

{% endblock %}
