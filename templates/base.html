<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}مدیریت کارها{% endblock %}</title>

    <!-- Tailwind Build -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">

    <!-- Jalali Datepicker -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css">

    <!-- Vazirmatn Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: "Vazirmatn", sans-serif;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">

    <!-- Toast Messages -->
    <div id="toast-container"
         class="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] space-y-3">
    </div>

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

    <!-- Jalali Datepicker -->
    <script src="https://cdn.jsdelivr.net/npm/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.js"></script>

    <script>
        jalaliDatepicker.startWatch({
            time: false,
            persianDigits: true,
            autoHide: true
        });
    </script>

    {% comment %} <!-- Global JavaScript -->
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/ui.js' %}"></script> {% endcomment %}

    <script src="{% static 'js/navbar.js' %}"></script>
    
    {% block extra_js %}
    {% endblock %}

</body>
</html>
